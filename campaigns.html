<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>My Campaigns | BrandFlow Connect</title>
    <meta name="description"
        content="BrandFlow Connect helps small businesses create, manage and analyze digital marketing campaigns.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/campaigns.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light" } catch (e) { }</script>
</head>

<body>
    <div class="overlay" data-close-nav></div>
    <aside class="sidebar" aria-label="Main navigation"><a href="index.html" class="logo"><span class="logo-i"><i
                    class="fa-solid fa-arrow-trend-up"></i></span><b>BrandFlow<small>Connect</small></b></a>
        <nav><a href="dashboard.html" class=""><i class="fa-solid fa-gauge-high" aria-hidden="true"></i>Dashboard</a><a
                href="campaigns.html" class="active"><i class="fa-solid fa-bullhorn"
                    aria-hidden="true"></i>Campaigns</a><a href="create-campaign.html" class=""><i
                    class="fa-solid fa-circle-plus" aria-hidden="true"></i>Create Campaign</a><a
                href="content-studio.html" class=""><i class="fa-solid fa-wand-magic-sparkles"
                    aria-hidden="true"></i>Content Studio</a><a href="analytics.html" class=""><i
                    class="fa-solid fa-chart-line" aria-hidden="true"></i>Analytics</a><a href="profile.html"
                class=""><i class="fa-solid fa-store" aria-hidden="true"></i>Business Profile</a><a href="settings.html"
                class=""><i class="fa-solid fa-gear" aria-hidden="true"></i>Settings</a></nav>
        <div class="side-foot">
            <div class="user"><span class="avatar">A</span>
                <div><b>Aravinthan</b><small>Business Owner</small></div>
            </div><button class="btn btn-ghost btn-block" id="logout"><i class="fa-solid fa-right-from-bracket"></i>
                Logout</button>
        </div>
    </aside>
    <div class="main">
        <header class="topbar"><button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><i
                    class="fa-solid fa-bars"></i></button>
            <div class="tb-title">
                <h1 id="pageTitle">My Campaigns</h1>
                <p>Create and manage your digital marketing campaigns.</p>
            </div>
            <div class="tb-actions"><a class="btn btn-primary hide-sm" href="create-campaign.html">+ Create
                    Campaign</a><button class="icon-btn" id="bell" aria-label="Notifications"><i
                        class="fa-solid fa-bell"></i><span class="dot"></span></button><button class="icon-btn"
                    data-theme-btn aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button><a
                    href="profile.html" class="avatar" aria-label="Profile">A</a></div>
        </header>
        <main>
            <div class="toolbar">
                <div class="seg" role="group" aria-label="Status filter"><button class="active"
                        data-f="All">All</button><button class="" data-f="Active">Active</button><button class=""
                        data-f="Scheduled">Scheduled</button><button class=""
                        data-f="Completed">Completed</button><button class="" data-f="Draft">Draft</button></div>
                <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" type="search"
                        placeholder="Search campaigns..." aria-label="Search campaigns"></div><select id="sort"
                    aria-label="Sort">
                    <option value="new">Newest</option>
                    <option value="reach">Highest reach</option>
                    <option value="eng">Highest engagement</option>
                    <option value="name">Name A–Z</option>
                </select>
            </div>
            <div id="list" class="grid3"></div>
        </main>
    </div>
    <script src="js/main.js"></script>
    <script src="js/campaigns.js"></script>
</body>

</html>
